<!DOCTYPE html><html><head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="البوابة الرسمية للقبول والتسجيل في جامعة العمارة الأهلية">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="جامعة العمارة الأهلية">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="photo/1.png">

  <title>جامعة العمارة الأهلية</title>
  <link rel="manifest" href="manifest.json">

  <!-- تصميم شاشة البداية بصورتك الخاصة -->
  <style>
    body {
      background-color: #000000;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      transition: opacity 0.5s ease-out;
    }
    #custom-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
    }
    #custom-splash img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    .hidden-splash {
      opacity: 0 !important;
      visibility: hidden !important;
    }
  </style>
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #000000;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <!-- عنصر عرض صورتك أثناء التحميل -->
  <div id="custom-splash">
    <img src="photo/1.png" alt="Logo">
  </div>

  <!-- سكربت متطور لإخفاء شاشة التحميل فور إقلاع فلاتر -->
  <script>
    let splashRemoved = false;

    function removeSplash() {
      if (splashRemoved) return;
      
      const splash = document.getElementById('custom-splash');
      if (splash) {
        splash.classList.add('hidden-splash');
        setTimeout(function() {
          if (splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
          splashRemoved = true;
        }, 800);
      }
    }

    // مراقبة الـ DOM للتأكد من بدء رسم عناصر فلاتر وإخفاء الصورة فوراً
    const observer = new MutationObserver((mutationsList) => {
        for (let mutation of mutationsList) {
            if (mutation.type === 'childList') {
                if (document.querySelector('flt-glass-pane') || document.querySelector('canvas') || document.querySelector('flutter-view')) {
                    removeSplash();
                    observer.disconnect();
                    break;
                }
            }
        }
    });

    observer.observe(document.body, { childList: true, subtree: true });

    // مؤقت احتياطي في حال تأخر الرصد لضمان إخفاء الشاشة بعد ثانيتين كحد أقصى
    window.addEventListener('load', function () {
        setTimeout(removeSplash, 2000);
    });
  </script>

  <script src="flutter_bootstrap.js" async=""></script>

</body></html>
