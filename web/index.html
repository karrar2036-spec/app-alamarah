<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="البوابة الرسمية للقبول والتسجيل في جامعة العمارة الأهلية">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="جامعة العمارة الأهلية">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="photo/1.png"/>

  <title>جامعة العمارة الأهلية</title>
  <link rel="manifest" href="manifest.json">

  <!-- تصميم شاشة البداية بصورتك الخاصة -->
  <style>
    body {
      background-color: #000000; /* لون خلفية التطبيق (أسود ليتناسب مع شاشتك) */
      margin: 0;
      height: 100vh;
      overflow: hidden;
      /* تأثير انتقال سلس لمنع الوميض */
      transition: opacity 0.5s ease-out;
    }
    #custom-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000; /* لون خلفية شاشة التحميل */
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      /* تأثير انتقال سلس عند الإخفاء */
      transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
    }
    #custom-splash img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    /* كلاس يتم إضافته عبر الجافاسكربت لإخفاء العنصر */
    .hidden-splash {
      opacity: 0 !important;
      visibility: hidden !important;
    }
  </style>
</head>
<body>
  <!-- عنصر عرض صورتك أثناء التحميل -->
  <div id="custom-splash">
    <img src="photo/1.png" alt="Logo">
  </div>

  <!-- سكربت أكثر موثوقية لإخفاء الصورة -->
  <script>
    // متغير لتتبع ما إذا تم إخفاء الشاشة
    let splashRemoved = false;

    function removeSplash() {
      if (splashRemoved) return;
      
      const splash = document.getElementById('custom-splash');
      if (splash) {
        // إضافة كلاس الإخفاء
        splash.classList.add('hidden-splash');
        
        // إزالة العنصر تماماً من الـ DOM بعد انتهاء الانتقال
        setTimeout(function() {
          if (splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
          splashRemoved = true;
        }, 800); // تتطابق مع مدة الـ transition في CSS
      }
    }

    // محاولة الإخفاء عند تحميل الصفحة كاحتياطي
    window.addEventListener('load', function () {
        setTimeout(removeSplash, 500); // تأخير بسيط إضافي
    });

    // الحل الأقوى: مراقبة DOM لتأكد من أن Flutter بدأ بالرسم
    // سننتظر ظهور عنصر له علاقة بـ Flutter داخل الـ body
    const observer = new MutationObserver((mutationsList) => {
        for (let mutation of mutationsList) {
            if (mutation.type === 'childList') {
                // فحص هل بدأ Flutter برسم عناصر canvas أو flt-glass-pane
                if (document.querySelector('flt-glass-pane') || document.querySelector('canvas')) {
                    removeSplash();
                    observer.disconnect(); // إيقاف المراقبة بعد النجاح
                    break;
                }
            }
        }
    });

    // بدء مراقبة الـ body بحثاً عن أي تغييرات
    observer.observe(document.body, { childList: true, subtree: true });
    
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
