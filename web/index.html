<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="البوابة الرسمية للقبول والتسجيل في جامعة العمارة الأهلية">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="جامعة العمارة الأهلية">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="photo/1.png"/>

  <title>جامعة العمارة الأهلية</title>
  <link rel="manifest" href="manifest.json">

  <!-- تصميم شاشة البداية بصورتك الخاصة -->
  <style>
    body {
      background-color: #000000;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      transition: opacity 0.5s ease-out;
    }
    #custom-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #000000;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.8s ease-out, visibility 0.8s ease-out;
    }
    #custom-splash img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }
    .hidden-splash {
      opacity: 0 !important;
      visibility: hidden !important;
    }
  </style>
</head>
<body>
  <!-- عنصر عرض صورتك أثناء التحميل -->
  <div id="custom-splash">
    <img src="photo/1.png" alt="Logo">
  </div>

  <!-- سكربت متطور لإخفاء شاشة التحميل فور إقلاع فلاتر -->
  <script>
    let splashRemoved = false;

    function removeSplash() {
      if (splashRemoved) return;
      
      const splash = document.getElementById('custom-splash');
      if (splash) {
        splash.classList.add('hidden-splash');
        setTimeout(function() {
          if (splash.parentNode) {
            splash.parentNode.removeChild(splash);
          }
          splashRemoved = true;
        }, 800);
      }
    }

    // مراقبة الـ DOM للتأكد من بدء رسم عناصر فلاتر وإخفاء الصورة فوراً
    const observer = new MutationObserver((mutationsList) => {
        for (let mutation of mutationsList) {
            if (mutation.type === 'childList') {
                if (document.querySelector('flt-glass-pane') || document.querySelector('canvas') || document.querySelector('flutter-view')) {
                    removeSplash();
                    observer.disconnect();
                    break;
                }
            }
        }
    });

    observer.observe(document.body, { childList: true, subtree: true });

    // مؤقت احتياطي في حال تأخر الرصد لضمان إخفاء الشاشة بعد ثانيتين كحد أقصى
    window.addEventListener('load', function () {
        setTimeout(removeSplash, 2000);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
