<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_application_1">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>جامعة العمارة الاهلية</title>
  <link rel="manifest" href="manifest.json">

  <!-- تصميم شاشة البداية بصورتك الخاصة -->
  <style>
    body {
      background-color: #ffffff; /* لون خلفية شاشة التحميل */
      margin: 0;
    }
    #custom-splash {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease;
    }
    #custom-splash img {
      width: 130px;
      height: 130px;
      object-fit: contain;
      animation: pulse 1.2s infinite alternate;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      100% { transform: scale(1.05); opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- عنصر عرض صورتك أثناء التحميل -->
  <div id="custom-splash">
    <img src="photo/1.png" alt="Logo">
  </div>

  <!-- سكربت لإخفاء صورتك تلقائياً بمجرد اشتغال تطبيق فلاتر -->
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        var splash = document.getElementById('custom-splash');
        if (splash) {
          splash.style.opacity = '0';
          setTimeout(function() {
            splash.style.display = 'none';
          }, 500);
        }
      }, 1000);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
