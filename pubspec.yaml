name: flutter_application_5
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  video_player: ^2.9.2
  url_launcher: ^6.3.2
  http: ^1.2.0
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  firebase_core: ^4.13.0
  firebase_messaging: ^16.5.0
  rename: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.3.1 # أضفنا هذه الحزمة الخاصة بشاشة البداية

flutter:
  uses-material-design: true

  # استدعاء كافة الصور والفيديوهات داخل مجلد photo دفعة واحدة
  assets:
    - photo/

# إعدادات أيقونة التطبيق الخارجية
flutter_launcher_icons:
  image_path: "photo/1.png"
  android: true
  ios: true
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "photo/1.png"

# إعدادات شاشة البداية (Splash Screen) عند فتح التطبيق
flutter_native_splash:
  color: "#000000" # لون الخلفية الأسود ليناسب شعارك
  image: "photo/1.png" # صورة الشعار
  android_12:
    color: "#000000"
    image: "photo/1.png"